
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        #timer {
            font-size: 60px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 25px;
        }

        .warning {
            color: red !important;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        .modal-content h2 {
            color: red;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 25px;
            }

            #timer {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Countdown Timer</h1>

        <div id="timer">10:00</div>

        <button id="startButton">Bắt đầu</button>
    </div>

    <!-- Modal thông báo -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Hết thời gian!</h2>
            <p>Đồng hồ đếm ngược đã kết thúc.</p>
            <br>
            <button id="closeButton">Đóng</button>
        </div>
    </div>

    <script>
        const totalTime = 10 * 60;

        let endTime;
        let interval = null;

        const timer = document.getElementById("timer");
        const startButton = document.getElementById("startButton");
        const modal = document.getElementById("modal");
        const closeButton = document.getElementById("closeButton");

        function updateTimer() {
            const remaining = Math.max(
                0,
                Math.ceil((endTime - Date.now()) / 1000)
            );

            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");

            if (remaining < 60) {
                timer.classList.add("warning");
            } else {
                timer.classList.remove("warning");
            }

            if (remaining <= 0) {
                clearInterval(interval);
                interval = null;

                modal.style.display = "flex";
                startButton.disabled = false;
                startButton.textContent = "Bắt đầu lại";
            }
        }

        function startTimer() {
            if (interval !== null) {
                clearInterval(interval);
            }

            endTime = Date.now() + totalTime * 1000;

            modal.style.display = "none";
            startButton.disabled = true;
            startButton.textContent = "Đang đếm ngược...";

            updateTimer();

            interval = setInterval(updateTimer, 1000);
        }

        startButton.addEventListener("click", startTimer);

        closeButton.addEventListener("click", function() {
            modal.style.display = "none";
        });

    </script>

</body>
</html>
